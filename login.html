    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
            background: #090d16 radial-gradient(circle at 50% 20%, #1e293b 0%, #0b1120 70%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: #1e293b;
            position: relative;
            overflow-x: hidden;
        }

        /* Efectos dinámicos y partículas de fondo */
        .bg-glow-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.22) 0%, rgba(37, 99, 235, 0) 70%);
            top: 20%;
            left: 25%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.18) 0%, rgba(14, 165, 233, 0) 70%);
            bottom: 10%;
            right: 20%;
            transform: translate(50%, 50%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
            animation: pulseGlow 10s ease-in-out 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9) translate(-10px, -10px); opacity: 0.7; }
            100% { transform: scale(1.15) translate(15px, 15px); opacity: 1; }
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
            perspective: 1000px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 26px 20px 22px 20px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.2);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: center bottom;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, filter 0.4s ease;
            box-sizing: border-box;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.94) rotateX(6deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0deg);
            }
        }

        /* Animación de salida al autenticar exitosamente */
        .login-card.autenticado {
            transform: scale(0.96) translateY(-10px);
            opacity: 0;
            filter: blur(4px);
        }

        /* Animación de vibración en caso de error */
        .login-card.shake {
            animation: shakeError 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shakeError {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* HEADER CON LOGO CIRCULAR A LA IZQUIERDA */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f1f5f9;
            width: 100%;
            box-sizing: border-box;
        }

        .brand-logo-circle {
            width: 46px;
            height: 46px;
            min-width: 46px;
            max-width: 46px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.18);
            border: 2px solid #e2e8f0;
            background: #ffffff;
            transition: transform 0.2s ease;
        }

        .brand-logo-circle:hover {
            transform: scale(1.04);
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            text-align: left;
            min-width: 0;
            flex: 1 1 auto;
            overflow: hidden;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.2px;
            color: #0f172a;
            line-height: 1.2;
            text-transform: uppercase;
            word-break: break-word;
            white-space: normal;
        }

        .brand-subtitle {
            font-size: 10.5px;
            font-weight: 700;
            color: #2563eb;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            margin-top: 2px;
            line-height: 1.2;
            word-break: break-word;
            white-space: normal;
        }

        .brand-desc {
            font-size: 10px;
            font-weight: 500;
            color: #64748b;
            margin-top: 2px;
            line-height: 1.2;
            word-break: break-word;
            white-space: normal;
        }

        /* FORMULARIO */
        .form-title-area {
            margin-bottom: 22px;
        }

        .form-title {
            font-size: 17px;
            font-weight: 700;
            color: #1e293b;
        }

        .form-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            padding: 13px 44px 13px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
            background: #f8fafc;
            color: #0f172a;
        }

        .input-group input:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .input-icon {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #togglePassword {
            cursor: pointer;
            transition: transform 0.15s, color 0.15s;
        }

        #togglePassword:hover {
            transform: scale(1.15);
            color: #2563eb;
        }

        /* BOTÓN DE ACCESO */
        .btn-acceso {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-acceso:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-acceso:active {
            transform: translateY(0);
        }

        .btn-acceso:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* SPINNER DE CARGA */
        .spinner-login {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* PANTALLA / OVERLAY DE ÉXITO */
        .splash-login-exito {
            position: fixed !important;
            inset: 0 !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-width: 100vw !important;
            min-height: 100dvh !important;
            background: #0b1120 !important;
            background: radial-gradient(circle at 50% 45%, #1e293b 0%, #0b1120 70%, #030712 100%) !important;
            display: none;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            z-index: 2147483647 !important;
            padding: 16px !important;
            margin: 0 !important;
            box-sizing: border-box !important;
            overflow: hidden !important;
            -webkit-overflow-scrolling: touch;
        }

        .splash-login-exito.activo {
            display: flex !important;
            animation: fadeInSplash 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        }

        @keyframes fadeInSplash {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .splash-contenido {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            width: 100% !important;
            max-width: 320px !important;
            margin: 0 auto !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            animation: splashZoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        }

        @keyframes splashZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .splash-icono-circulo {
            width: 80px !important;
            height: 80px !important;
            border-radius: 50% !important;
            background: rgba(37, 99, 235, 0.2) !important;
            border: 2.5px solid #3b82f6 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.6) !important;
            animation: pulseIcon 1.2s infinite alternate ease-in-out !important;
            margin: 0 auto 16px auto !important;
            flex-shrink: 0 !important;
            overflow: hidden !important;
            font-size: 36px !important;
        }

        .splash-icono-circulo img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            border-radius: 50% !important;
            display: block !important;
        }

        @keyframes pulseIcon {
            from { transform: scale(0.95); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
            to { transform: scale(1.05); box-shadow: 0 0 45px rgba(59, 130, 246, 0.85); }
        }

        .splash-texto-titulo {
            color: #ffffff !important;
            font-size: 19px !important;
            font-weight: 800 !important;
            letter-spacing: -0.3px !important;
            margin: 0 auto 6px auto !important;
            line-height: 1.25 !important;
            text-align: center !important;
            width: 100% !important;
            max-width: 300px !important;
            word-break: break-word !important;
            box-sizing: border-box !important;
        }

        .splash-texto-sub {
            color: #94a3b8 !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            line-height: 1.4 !important;
            margin: 0 auto !important;
            text-align: center !important;
            width: 100% !important;
            max-width: 280px !important;
            word-break: break-word !important;
            box-sizing: border-box !important;
        }

        .splash-barra-progreso {
            width: 160px !important;
            max-width: 70% !important;
            height: 4px !important;
            background: rgba(255, 255, 255, 0.15) !important;
            border-radius: 4px !important;
            margin: 18px auto 0 auto !important;
            overflow: hidden !important;
            position: relative !important;
        }

        .splash-barra-progreso::after {
            content: "" !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            height: 100% !important;
            width: 0% !important;
            background: linear-gradient(90deg, #3b82f6, #60a5fa, #38bdf8) !important;
            animation: fillBar 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* MENSAJE DE ESTADO */
        #mensajeFeedback {
            min-height: 22px;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* CREDENCIALES RÁPIDAS */
        .demo-box {
            margin-top: 24px;
            padding: 14px 16px;
            background: #f8fafc;
            border-radius: 12px;
            font-size: 12px;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .demo-box-header {
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .demo-tag {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 600;
            color: #1e293b;
        }

        /* RESPONSIVE MÓVIL */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }

            .login-card {
                padding: 24px 18px 20px 18px;
                border-radius: 20px;
            }

            .brand-header {
                gap: 11px;
                margin-bottom: 18px;
                padding-bottom: 14px;
            }

            .brand-logo-circle {
                width: 48px;
                height: 48px;
            }

            .brand-title {
                font-size: 15px;
                letter-spacing: 0.1px;
            }

            .brand-subtitle {
                font-size: 10.5px;
                letter-spacing: 0.2px;
            }

            .brand-desc {
                font-size: 10px;
            }

            .form-title-area {
                margin-bottom: 16px;
            }

            .form-title {
                font-size: 15.5px;
            }

            .form-subtitle {
                font-size: 12px;
            }

            .campo {
                margin-bottom: 14px;
            }

            .campo label {
                font-size: 12.5px;
                margin-bottom: 5px;
            }

            .input-group input {
                padding: 12px 40px 12px 12px;
                font-size: 13.5px;
                min-height: 46px;
            }

            .btn-acceso {
                min-height: 46px;
                font-size: 14px;
                padding: 12px;
            }

            .footer-text {
                margin-top: 18px;
                font-size: 11px;
            }
        }

        @media (max-width: 360px) {
            .brand-header {
                flex-direction: column;
                text-align: center;
                align-items: center;
                gap: 8px;
            }
            .brand-info {
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- PANTALLA SPLASH DE BIENVENIDA / TRANSICIÓN -->
<div id="splashLoginExito" class="splash-login-exito" role="status" aria-live="polite">
    <div class="splash-contenido">
        <div class="splash-icono-circulo" id="splashIconoAvatar">
            <span style="font-size: 38px;">🚀</span>
        </div>
        <div class="splash-texto-titulo" id="splashNombreUsuario">¡Bienvenido al Sistema!</div>
        <div class="splash-texto-sub" id="splashRolUsuario">Cargando módulos de gestión y control operacional...</div>
        <div class="splash-barra-progreso"></div>
    </div>
</div>

<div class="login-container">
    <div class="login-card" id="loginCard">
        <!-- HEADER CORPORATIVO: LOGO CIRCULAR A LA IZQUIERDA + TEXTOS -->
        <div class="brand-header">
            <img 
                src="logo_isotipo.svg" 
                alt="Logo Isotipo CORSSEN" 
                class="brand-logo-circle" 
                id="imgIsotipoLogo"
                onerror="this.onerror=null; this.src='logo.png';"
            >
            <div class="brand-info">
                <div class="brand-title">CORSSEN LOGÍSTICA</div>
                <div class="brand-subtitle">Control de Flota y Maquinaria</div>
                <div class="brand-desc">Gestión y Control Operacional</div>
            </div>
        </div>

        <div class="form-title-area">
            <h2 class="form-title">Iniciar Sesión</h2>
            <p class="form-subtitle">Ingrese sus credenciales autorizadas</p>
        </div>

        <!-- FORMULARIO DE ACCESO -->
        <form id="loginForm">
            <div class="campo">
                <label for="usuario">Usuario del Sistema</label>
                <div class="input-group">
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ej: admin u operador"
                        autocomplete="username"
                        required
                    >
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <div class="input-group">
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                    <span
                        class="input-icon"
                        id="togglePassword"
                        title="Ver / ocultar contraseña"
                        role="button"
                        aria-label="Ver u ocultar contraseña"
                    >
                        <svg id="svgEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-acceso" id="btnIngresar">
                <span>Ingresar al Sistema</span>
                <span>→</span>
            </button>

            <p id="mensajeFeedback"></p>
        </form>

        <div class="footer-text">
            CORSSEN LOGÍSTICA © 2026 • Plataforma de Gestión
        </div>
    </div>
</div>

<script>
    // Mostrar / Ocultar contraseña
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    const svgEyeIcon = document.getElementById("svgEyeIcon");

    togglePassword?.addEventListener("click", () => {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            if (svgEyeIcon) {
                svgEyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            }
        } else {
            passwordInput.type = "password";
            if (svgEyeIcon) {
                svgEyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            }
        }
    });

    function ejecutarTransicionExitosa(datos) {
        // Cerrar teclado virtual móvil y resetear posición de pantalla
        if (document.activeElement && typeof document.activeElement.blur === "function") {
            document.activeElement.blur();
        }
        
        // Bloquear desplazamiento y resetear viewport
        document.documentElement.style.overflow = "hidden";
        document.body.style.overflow = "hidden";
        window.scrollTo(0, 0);

        const card = document.getElementById("loginCard");
        const container = document.querySelector(".login-container");
        const splash = document.getElementById("splashLoginExito");
        const splashNombre = document.getElementById("splashNombreUsuario");
        const splashRol = document.getElementById("splashRolUsuario");
        const splashAvatar = document.getElementById("splashIconoAvatar");

        sessionStorage.setItem("usuarioLogueado", datos.usuario);
        sessionStorage.setItem("nombreUsuario", datos.nombre);
        sessionStorage.setItem("rolUsuario", datos.rol);

        // Prioridad 1: Avatar guardado de forma permanente en localStorage para este usuario
        const avatarLocalKey = "usuarioAvatar_" + String(datos.usuario || "").toLowerCase().trim();
        const avatarPersistente = localStorage.getItem(avatarLocalKey) || localStorage.getItem("corssen_avatar_actual");

        const avatarFinal = avatarPersistente || datos.avatar || (datos.rol === "admin" ? "avatar-admin" : "avatar-mecanico");
        
        sessionStorage.setItem("avatarUsuario", avatarFinal);
        localStorage.setItem(avatarLocalKey, avatarFinal);
        localStorage.setItem("corssen_avatar_actual", avatarFinal);

        // Renderizar avatar / foto personalizada en el círculo splash
        if (splashAvatar) {
            if (avatarFinal.startsWith("data:image/") || avatarFinal.startsWith("http://") || avatarFinal.startsWith("https://") || avatarFinal.startsWith("/")) {
                splashAvatar.innerHTML = `<img src="${avatarFinal}" alt="Avatar" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                splashAvatar.style.background = "#0f172a";
            } else {
                const mapIconos = {
                    "avatar-admin": "👨‍💼",
                    "avatar-mecanico": "👷‍♂️",
                    "avatar-supervisor": "📋",
                    "avatar-supervisora": "👩‍💼",
                    "avatar-chofer": "🚚",
                    "avatar-camion": "🚚",
                    "avatar-seguridad": "🛡️",
                    "avatar-corssen": "🚢",
                    "avatar-grua-porta": "🏗️",
                    "avatar-horquilla": "🚜",
                    "avatar-maritimo": "⚓",
                    "avatar-panol": "🔧",
                    "avatar-tecnica": "👷‍♀️",
                    "avatar-electrico": "⚡",
                    "avatar-planificador": "📋",
                    "avatar-combustible": "⛽",
                    "avatar-ingeniero": "🧑‍💻"
                };
                splashAvatar.innerHTML = `<span style="font-size:36px;">${mapIconos[avatarFinal] || "👤"}</span>`;
                splashAvatar.style.background = "rgba(37, 99, 235, 0.2)";
            }
        }

        if (splashNombre) splashNombre.textContent = `¡Bienvenido, ${datos.nombre || datos.usuario}!`;
        if (splashRol) splashRol.textContent = `Rol: ${datos.rol === "admin" ? "Administrador General" : "Operador"} • Accediendo al panel...`;

        // Transición animada
        card?.classList.add("autenticado");
        if (container) {
            container.style.display = "none";
        }
        if (splash) {
            splash.classList.add("activo");
        }

        setTimeout(() => {
            window.location.href = "/";
        }, 1100);
    }

    function mostrarErrorAnimado(mensaje) {
        const card = document.getElementById("loginCard");
        const feedback = document.getElementById("mensajeFeedback");
        const boton = document.getElementById("btnIngresar");

        feedback.textContent = "⚠️ " + mensaje;
        feedback.style.color = "#dc2626";
        boton.disabled = false;
        boton.innerHTML = "<span>Ingresar al Sistema</span> <span>→</span>";

        card?.classList.remove("shake");
        // Reflow para reiniciar animación
        void card?.offsetWidth;
        card?.classList.add("shake");
    }

    // Envío del Login al servidor
    document.getElementById("loginForm")?.addEventListener("submit", async function(e) {
        e.preventDefault();

        const usuario = document.getElementById("usuario").value.trim();
        const password = document.getElementById("password").value;
        const feedback = document.getElementById("mensajeFeedback");
        const boton = document.getElementById("btnIngresar");

        feedback.textContent = "";
        boton.disabled = true;
        boton.innerHTML = `<span class="spinner-login"></span> <span>Verificando credenciales...</span>`;

        try {
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ usuario, password })
            });

            const datos = await res.json();

            if (res.ok) {
                feedback.textContent = "✓ Credenciales autorizadas. Ingresando...";
                feedback.style.color = "#16a34a";
                ejecutarTransicionExitosa(datos);
            } else {
                mostrarErrorAnimado(datos.mensaje || "Usuario o contraseña inválidos");
            }
        } catch (err) {
            console.warn("Servidor backend no disponible, evaluando autenticación local:", err);
            const uNorm = usuario.toLowerCase().trim();
            if ((uNorm === "admin" && (password === "admin" || password === "corssen2026")) ||
                (uNorm === "operador" && (password === "1234" || password === "operador"))) {
                const esAdmin = uNorm === "admin";
                const datosLocales = {
                    usuario: uNorm,
                    nombre: esAdmin ? "Administrador General" : "Operador Principal",
                    rol: esAdmin ? "admin" : "operador",
                    avatar: esAdmin ? "avatar-admin" : "avatar-mecanico"
                };
                feedback.textContent = "✓ Credenciales correctas. Ingresando...";
                feedback.style.color = "#16a34a";
                ejecutarTransicionExitosa(datosLocales);
                return;
            }

            mostrarErrorAnimado("Usuario o contraseña incorrectos. Acceso denegado.");
        }
    });
</script>
